---
- name: "Ensure Go environment is set up"
  ansible.builtin.shell: |
    export PATH=$PATH:$(go env GOPATH)/bin
    echo 'export PATH=$PATH:$(go env GOPATH)/bin' >> ~/.bashrc
  args:
    creates: /tmp/go_path_setup_done
  changed_when: false

- name: "Install Subdomain tools"
  ansible.builtin.shell: "go install -v {{ item }}@latest"
  environment:
    PATH: "{{ ansible_env.HOME }}/go/bin:{{ ansible_env.PATH }}"
  loop:
    - github.com/projectdiscovery/subfinder/v2/cmd/subfinder
    - github.com/owasp-amass/amass/v4/...
    - github.com/tomnomnom/assetfinder
    - github.com/Findomain/findomain
    - github.com/projectdiscovery/chaos-client/cmd/chaos

