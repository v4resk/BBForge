---
- name: "Check if Go is installed"
  ansible.builtin.command: which go
  register: go_check
  failed_when: false
  changed_when: false

- name: "Fail if Go is not installed"
  ansible.builtin.fail:
    msg: "Go is not installed. Please ensure golang package is installed first."
  when: go_check.rc != 0

- name: "Get current Go version"
  ansible.builtin.shell: "go version | awk '{print $3}' | sed 's/go//'"
  register: go_version_output
  changed_when: false
  when: go_check.rc == 0

- name: "Check if Go version is too old (< 1.21)"
  ansible.builtin.set_fact:
    go_needs_upgrade: "{{ go_version_output.stdout is version('1.21', '<') }}"
  when: go_check.rc == 0

- name: "Download newer Go version (1.23.5)"
  become: true
  become_method: sudo
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go1.23.5.linux-amd64.tar.gz"
    dest: /tmp/go1.23.5.linux-amd64.tar.gz
    mode: '0644'
  when:
    - go_check.rc == 0
    - go_needs_upgrade | default(false) | bool

- name: "Remove old Go installation"
  become: true
  become_method: sudo
  ansible.builtin.file:
    path: /usr/local/go
    state: absent
  when:
    - go_check.rc == 0
    - go_needs_upgrade | default(false) | bool

- name: "Extract new Go version"
  become: true
  become_method: sudo
  ansible.builtin.unarchive:
    src: /tmp/go1.23.5.linux-amd64.tar.gz
    dest: /usr/local
    remote_src: true
  when:
    - go_check.rc == 0
    - go_needs_upgrade | default(false) | bool

- name: "Update PATH to use new Go"
  ansible.builtin.set_fact:
    go_binary_path: "/usr/local/go/bin/go"
  when:
    - go_check.rc == 0
    - go_needs_upgrade | default(false) | bool

- name: "Update PATH to use system Go"
  ansible.builtin.set_fact:
    go_binary_path: "go"
  when:
    - go_check.rc == 0
    - not (go_needs_upgrade | default(false) | bool)

- name: "Add new Go to PATH in .bashrc"
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: 'export PATH="/usr/local/go/bin:$PATH"'
    regexp: '^export PATH=.*\/usr\/local\/go\/bin'
    create: true
  become: false
  when:
    - go_check.rc == 0
    - go_needs_upgrade | default(false) | bool

- name: "Add new Go to PATH in .zshrc"
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'export PATH="/usr/local/go/bin:$PATH"'
    regexp: '^export PATH=.*\/usr\/local\/go\/bin'
    create: true
  become: false
  when:
    - go_check.rc == 0
    - go_needs_upgrade | default(false) | bool

- name: "Get Go GOPATH"
  ansible.builtin.command: "{{ go_binary_path | default('go') }} env GOPATH"
  register: go_gopath
  changed_when: false
  when: go_check.rc == 0

- name: "Add Go bin to PATH in .bashrc"
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: 'export PATH="$PATH:{{ go_gopath.stdout }}/bin"'
    regexp: '^export PATH=.*go.*bin'
    create: true
  become: false
  when: go_check.rc == 0 and go_gopath.stdout is defined
  failed_when: false

- name: "Add Go bin to PATH in .zshrc"
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'export PATH="$PATH:{{ go_gopath.stdout }}/bin"'
    regexp: '^export PATH=.*go.*bin'
    create: true
  become: false
  when: go_check.rc == 0 and go_gopath.stdout is defined
  failed_when: false

- name: "Install Subdomain tools"
  ansible.builtin.shell: "{{ go_binary_path | default('go') }} install -v {{ item }}@latest"
  environment:
    PATH: "/usr/local/go/bin:{{ go_gopath.stdout }}/bin:{{ ansible_env.PATH }}"
    GOPATH: "{{ go_gopath.stdout }}"
  loop:
    - github.com/projectdiscovery/subfinder/v2/cmd/subfinder
    - github.com/owasp-amass/amass/v4/...
    - github.com/tomnomnom/assetfinder
    - github.com/projectdiscovery/chaos-client/cmd/chaos
  when: go_check.rc == 0 and go_gopath.stdout is defined
  failed_when: false
  register: subdomain_tools_install

- name: "Check if findomain is already installed"
  ansible.builtin.stat:
    path: /usr/local/bin/findomain
  register: findomain_bin

- name: "Get latest Findomain release info"
  ansible.builtin.uri:
    url: "https://api.github.com/repos/Findomain/Findomain/releases/latest"
    return_content: true
  register: findomain_release
  when: not findomain_bin.stat.exists

- name: "Select Findomain Linux asset for current architecture"
  ansible.builtin.set_fact:
    findomain_asset_url: "{{ item.browser_download_url }}"
  loop: "{{ findomain_release.json.assets | default([]) }}"
  when:
    - not findomain_bin.stat.exists
    - item.browser_download_url is defined
    - item.name is defined
    - >-
      (ansible_architecture in ['x86_64','amd64'] and item.name in ['findomain-linux.zip','findomain-linux']) or
      (ansible_architecture in ['aarch64','arm64'] and item.name in ['findomain-aarch64.zip','findomain-arm64.zip']) or
      (ansible_architecture in ['armv7l'] and item.name in ['findomain-armv7.zip','findomain-armv7l.zip'])
    - findomain_asset_url is not defined
  loop_control:
    label: "{{ item.name }}"

- name: "Fail if Findomain asset could not be determined"
  ansible.builtin.fail:
    msg: "Could not find a compatible Findomain Linux release asset for arch={{ ansible_architecture }}."
  when:
    - not findomain_bin.stat.exists
    - findomain_asset_url is not defined

- name: "Download Findomain release asset"
  ansible.builtin.get_url:
    url: "{{ findomain_asset_url }}"
    dest: /tmp/findomain_release_asset
    mode: '0644'
    force: true
  when:
    - not findomain_bin.stat.exists
    - findomain_asset_url is defined

- name: "Ensure Findomain extract directory exists"
  ansible.builtin.file:
    path: /tmp/findomain_extract
    state: directory
    mode: '0755'
  when:
    - not findomain_bin.stat.exists
    - findomain_asset_url is defined

- name: "Extract Findomain zip"
  become: true
  become_method: sudo
  ansible.builtin.unarchive:
    src: /tmp/findomain_release_asset
    dest: /tmp/findomain_extract
    remote_src: true
  when:
    - not findomain_bin.stat.exists
    - findomain_asset_url is defined
    - findomain_asset_url is search('\\.zip$')

- name: "Locate extracted Findomain binary"
  ansible.builtin.find:
    paths: /tmp/findomain_extract
    patterns:
      - "findomain"
      - "findomain-*"
    file_type: file
    recurse: true
  register: findomain_candidates
  when:
    - not findomain_bin.stat.exists
    - findomain_asset_url is defined

- name: "Fail if Findomain binary was not found after extraction"
  ansible.builtin.fail:
    msg: "Findomain asset was downloaded but no findomain binary was found after extraction."
  when:
    - not findomain_bin.stat.exists
    - findomain_asset_url is defined
    - (findomain_candidates.files | default([]) | length) == 0

- name: "Install Findomain binary"
  become: true
  become_method: sudo
  ansible.builtin.copy:
    src: "{{ (findomain_candidates.files | sort(attribute='path') | first).path }}"
    dest: /usr/local/bin/findomain
    mode: '0755'
    remote_src: true
  when:
    - not findomain_bin.stat.exists
    - findomain_asset_url is defined
    - (findomain_candidates.files | default([]) | length) > 0

