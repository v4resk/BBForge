---
- name: "Check if Go is installed"
  ansible.builtin.command: which go
  register: go_check
  failed_when: false
  changed_when: false

- name: "Fail if Go is not installed"
  ansible.builtin.fail:
    msg: "Go is not installed. Please ensure golang package is installed first."
  when: go_check.rc != 0

- name: "Get Go GOPATH"
  ansible.builtin.command: go env GOPATH
  register: go_gopath
  changed_when: false
  when: go_check.rc == 0

- name: "Add Go bin to PATH in .bashrc"
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    line: 'export PATH="$PATH:{{ go_gopath.stdout }}/bin"'
    regexp: '^export PATH=.*go.*bin'
    create: true
  become: false
  when: go_check.rc == 0 and go_gopath.stdout is defined

- name: "Add Go bin to PATH in .zshrc"
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    line: 'export PATH="$PATH:{{ go_gopath.stdout }}/bin"'
    regexp: '^export PATH=.*go.*bin'
    create: true
  become: false
  when: go_check.rc == 0 and go_gopath.stdout is defined

- name: "Install Subdomain tools"
  ansible.builtin.shell: "go install -v {{ item }}@latest"
  environment:
    PATH: "{{ go_gopath.stdout }}/bin:{{ ansible_env.PATH }}"
    GOPATH: "{{ go_gopath.stdout }}"
  loop:
    - github.com/projectdiscovery/subfinder/v2/cmd/subfinder
    - github.com/owasp-amass/amass/v4/...
    - github.com/tomnomnom/assetfinder
    - github.com/Findomain/findomain
    - github.com/projectdiscovery/chaos-client/cmd/chaos
  when: go_check.rc == 0 and go_gopath.stdout is defined

