---
- name: "Check if pipx is installed"
  ansible.builtin.command: which pipx
  register: pipx_check
  failed_when: false
  changed_when: false

- name: "Fail if pipx is not installed"
  ansible.builtin.fail:
    msg: "pipx is not installed. Please ensure pipx package is installed first."
  when: pipx_check.rc != 0

- name: "Ensure pipx bin directory is in PATH"
  ansible.builtin.shell: "pipx ensurepath"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  become: false
  when: pipx_check.rc == 0
  changed_when: false

- name: "Install Waymore (pipx from git)"
  ansible.builtin.shell: "pipx install git+https://github.com/xnl-h4ck3r/waymore.git"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  become: false
  when: pipx_check.rc == 0
  failed_when: false
  changed_when: true

- name: "Install SQLi/XSS tools"
  ansible.builtin.shell: "pipx install {{ item }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  loop:
    - sqlmap
    - ghauri
    - xsstrike
  become: false
  when: pipx_check.rc == 0
  failed_when: false
  changed_when: true

- name: "Install Cert Monitoring tools"
  ansible.builtin.shell: "pipx install {{ item }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  loop:
    - certstream
    - certstream-go
  become: false
  when: pipx_check.rc == 0
  failed_when: false
  changed_when: true

- name: "Install API Discovery tools"
  ansible.builtin.shell: "pipx install {{ item }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  loop:
    - arjun
