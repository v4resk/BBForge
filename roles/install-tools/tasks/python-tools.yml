  become: false
  when: pipx_check.rc == 0
  failed_when: false
  changed_when: true

- name: "Install Cloud tools"
  ansible.builtin.shell: "pipx install {{ item }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  loop:
    - awscli
    - cloudenum
    - s3scanner
  become: false
  when: pipx_check.rc == 0
  failed_when: false
  changed_when: true

- name: "Install OSINT tools"
  ansible.builtin.shell: "pipx install {{ item }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  loop:
    - shodan
    - censys
    - metabigor
  become: false
  when: pipx_check.rc == 0
  failed_when: false
  changed_when: true

- name: "Install Scope Management tools"
  ansible.builtin.shell: "pipx install {{ item }}"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  loop:
    - bbrf
  become: false
  when: pipx_check.rc == 0
  failed_when: false
  changed_when: true

