- name: "Ensure Firefox distribution directory exists"
  ansible.builtin.file:
    path: /usr/share/firefox-esr/distribution
    state: directory
    mode: '0755'
  become: true
  become_method: sudo

- name: "Updating Firefox Policies"
  ansible.builtin.template: 
    src: "templates/policies.json.j2"
    dest: "/usr/share/firefox-esr/distribution/policies.json"
  become: true
  become_method: sudo