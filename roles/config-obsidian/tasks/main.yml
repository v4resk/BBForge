---
# tasks file for config-obsidian
- name: "Creating Obsidian directory"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/obsidian"
    state: directory
    mode: '0755'
  become: false

- name: "Check if Obsidian AppImage already exists"
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.local/share/obsidian/Obsidian.AppImage"
  register: obsidian_appimage_exists

- name: "Find local Obsidian AppImage in role files/"
  ansible.builtin.find:
    paths: "{{ role_path }}/files"
    patterns: "Obsidian-*.AppImage"
    file_type: file
    recurse: false
  register: obsidian_local_files
  when: not obsidian_appimage_exists.stat.exists

- name: "Copy Obsidian AppImage from files (if available)"
  ansible.builtin.copy:
    src: "{{ (obsidian_local_files.files | sort(attribute='path') | last).path }}"
    dest: "{{ ansible_env.HOME }}/.local/share/obsidian/Obsidian.AppImage"
    mode: '0755'
  become: false
  when:
    - not obsidian_appimage_exists.stat.exists
    - (obsidian_local_files.files | default([]) | length) > 0

- name: "Get latest Obsidian release info (if no local copy)"
  ansible.builtin.uri:
    url: "https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest"
    return_content: true
  register: obsidian_release
  when:
    - not obsidian_appimage_exists.stat.exists
    - (obsidian_local_files.files | default([]) | length) == 0

- name: "Find Obsidian AppImage URL for current architecture"
  ansible.builtin.set_fact:
    obsidian_appimage_url: "{{ item.browser_download_url }}"
  loop: "{{ obsidian_release.json.assets | default([]) }}"
  when:
    - not obsidian_appimage_exists.stat.exists
    - (obsidian_local_files.files | default([]) | length) == 0
    - obsidian_release.json.assets is defined
    - item.name is match('.*AppImage$')
    - (ansible_architecture == 'x86_64' and ('x86_64' in item.name or 'amd64' in item.name)) or
      (ansible_architecture == 'aarch64' and 'arm64' in item.name) or
      (ansible_architecture == 'armv7l' and 'armv7' in item.name)
  loop_control:
    label: "{{ item.name }}"

- name: "Download Obsidian AppImage from GitHub (if no local copy)"
  ansible.builtin.get_url:
    url: "{{ obsidian_appimage_url }}"
    dest: "{{ ansible_env.HOME }}/.local/share/obsidian/Obsidian.AppImage"
    mode: '0755'
  when:
    - not obsidian_appimage_exists.stat.exists
    - (obsidian_local_files.files | default([]) | length) == 0
    - obsidian_appimage_url is defined
  become: false

- name: "Creating config folder"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/obsidian/"
    state: directory
  become: false

- name: "Settings up obsidian"
  ansible.builtin.template: 
    src: "templates/obsidian.json.j2"
    dest: "{{ ansible_env.HOME }}/.config/obsidian/obsidian.json"
  become: false

- name: "Creating the vault folder"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/obsidian/MyVault/"
    state: directory
  become: false

- name: "Creating vault sub-folders"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/obsidian/MyVault/{{ item }}"
    state: directory
  loop:
    - Templates
    - HTB
  become: false

- name: "Configuring the vault"
  ansible.builtin.copy:
    src: "files/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/.local/share/obsidian/MyVault/{{ item.dest }}"
  loop:
    - { src: ".obsidian", dest: "./" }
    - { src: "Endpoint Pentest  - Template.md", dest: "Templates/Endpoint Pentest  - Template.md" }
    - { src: "OSCP-exam-report-template_whoisflynn_v3.2.md", dest: "Templates/OSCP-exam-report-template_whoisflynn_v3.2.md" }
  become: false


